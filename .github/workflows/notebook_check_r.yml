name: Execute R notebooks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main

jobs:
  test-r-notebooks:
    uses: ./.github/workflows/notebook-test-r-reusable.yml
    with:
      notebook_selection: 'all'

  report-failure:
    needs: test-r-notebooks
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get CODEOWNERS assignees
        id: codeowners
        run: |
          owners=$(grep '^\*' .github/CODEOWNERS | sed 's/^\*[[:space:]]*//' | sed 's/@//g' | tr -s ' ' ',' | sed 's/,$//')
          echo "assignees=$owners" >> $GITHUB_OUTPUT
      - name: Create issue body
        run: |
          echo "The scheduled R notebook execution failed." > /tmp/issue-body.md
          echo "" >> /tmp/issue-body.md
          echo "**Workflow run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/issue-body.md
      - name: Create Issue
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: R Notebook Execution Failure
          content-filepath: /tmp/issue-body.md
          labels: report, automated issue
          assignees: ${{ steps.codeowners.outputs.assignees }}